name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar projeto
        run: mvn clean package -DskipTests

      - name: Preparar JARs
        run: |
          mkdir -p release

          find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "original-*.jar" \
            -exec cp {} release/ \;

          echo "JARs que serão enviados:"
          ls -lh release/

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Build automático.

            Commit:
            ${{ github.sha }}
          files: |
            release/*.jar
          prerelease: false
