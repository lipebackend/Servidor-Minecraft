name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 25 (o ASP API 4.2.0-SNAPSHOT é compilado para Java 25; o bytecode do plugin continua Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ler informações do commit
        id: commit
        run: |
          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=%B >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          echo "author=$(git log -1 --pretty=%an)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git log -1 --pretty=%H)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git log -1 --pretty=%h)" >> "$GITHUB_OUTPUT"

      - name: Compilar projeto
        run: mvn clean package -DskipTests

      - name: Preparar JARs
        run: |
          mkdir -p release

          find al3hg-plugin/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "original-*.jar" \
            -exec cp {} release/ \;

          echo "JARs:"
          ls -lh release/

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ steps.commit.outputs.short_sha }}
          name: ${{ steps.commit.outputs.subject }}
          body: |
            ## ${{ steps.commit.outputs.subject }}

            ${{ steps.commit.outputs.message }}

            ---

            **Commit:** `${{ steps.commit.outputs.sha }}`

            **Autor:** ${{ steps.commit.outputs.author }}

            **Branch:** `${{ github.ref_name }}`

            **Build:** #${{ github.run_number }}

            **JARs**

            Build automático realizado pelo GitHub Actions.

          files: |
            release/*.jar
          prerelease: false